name: Input Leap keymap core

on:
  push:
    branches:
      - codex/input-leap-keymap
  pull_request:
    branches:
      - codex/input-leap-keymap
  workflow_dispatch:

env:
  B_BUILD_TYPE: Release

jobs:
  windows-core:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Bonjour SDK-like
        id: bonjour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory -Path deps | Out-Null
          Invoke-WebRequest `
            'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' `
            -OutFile 'deps/BonjourSDKLike.zip'
          Expand-Archive 'deps/BonjourSDKLike.zip' -DestinationPath 'deps/BonjourSDKLike'
          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT

      - name: Configure core build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -D CMAKE_BUILD_TYPE=$env:B_BUILD_TYPE `
            -D INPUTLEAP_BUILD_GUI=OFF `
            -D INPUTLEAP_BUILD_TESTS=ON `
            -D DNSSD_LIB="${{ steps.bonjour.outputs.path }}\Lib\x64\dnssd.lib"
        env:
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}

      - name: Build core and tests
        run: cmake --build build --config $env:B_BUILD_TYPE --parallel

      - name: Run keymap tests
        run: build/bin/Release/unittests.exe --gtest_filter=KeyRemapperTests.*

      - name: Smoke test command-line binaries
        shell: pwsh
        run: |
          build/bin/Release/input-leaps.exe --version
          $clientVersion = build/bin/Release/input-leapc.exe --version 127.0.0.1 2>&1 | Out-String
          $clientVersion
          if ($clientVersion -notmatch 'input-leapc\.exe 3\.0\.3') {
            throw "input-leapc did not start and report its version"
          }
          exit 0

      - name: Upload command-line binaries
        uses: actions/upload-artifact@v4
        with:
          name: input-leap-keymap-windows-core
          path: |
            build/bin/Release/input-leaps.exe
            build/bin/Release/input-leapc.exe
          if-no-files-found: warn

  macos-arm64-app:
    runs-on: macos-14
    env:
      OPENSSL_VERSION: 3.2.0
      OPENSSL_PREFIX: /Users/runner/openssl-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ninja qt@5

      - name: Cache arm64 OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: macos-arm64-openssl-${{ env.OPENSSL_VERSION }}

      - name: Build arm64 OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl.tar.gz
          tar -xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          ./Configure no-asm darwin64-arm64-cc --prefix="${OPENSSL_PREFIX}"
          make -j"$(sysctl -n hw.logicalcpu)"
          make install_sw

      - name: Configure arm64 app
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DOpenSSL_ROOT="${OPENSSL_PREFIX}" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DQT_DEFAULT_MAJOR_VERSION=5 \
            -DINPUTLEAP_BUILD_GULRAK_FILESYSTEM=ON \
            -DINPUTLEAP_BUILD_GUI=ON \
            -DINPUTLEAP_BUILD_TESTS=OFF \
            -DINPUTLEAP_VERSION_DESC=git

      - name: Build arm64 app
        run: cmake --build build --target input-leap input-leapc input-leaps --parallel

      - name: Package and verify arm64 app
        run: |
          chmod +x dist/macos/package_keymap_gui.sh
          INPUTLEAP_KEYMAP_VERSION="3.0.3-${GITHUB_SHA::7}" \
          MACDEPLOYQT="$(brew --prefix qt@5)/bin/macdeployqt" \
            dist/macos/package_keymap_gui.sh \
              build/bin/input-leap build/bin/input-leapc \
              build/bin/input-leaps "Input Leap Keymap.app"
          for binary in input-leap input-leapc input-leaps; do
            test "$(lipo -archs "build/bin/${binary}")" = "arm64"
            file "build/bin/${binary}"
          done
          codesign -d -r- "Input Leap Keymap.app" 2>&1 | \
            grep -F 'designated => identifier "com.johneybi.input-leap-keymap.client"'
          if [[ "$(uname -m)" == "arm64" ]]; then
            set +e
            version_output="$(build/bin/input-leapc --version 127.0.0.1 2>&1)"
            set -e
            echo "${version_output}"
            grep -q "input-leapc 3.0.3" <<< "${version_output}"
          fi
          tar -czf input-leap-keymap-macos-arm64.tar.gz "Input Leap Keymap.app"

      - name: Upload arm64 app
        uses: actions/upload-artifact@v4
        with:
          name: input-leap-keymap-macos-arm64-app
          path: input-leap-keymap-macos-arm64.tar.gz
          if-no-files-found: error
