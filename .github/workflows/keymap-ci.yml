name: Keymap CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavahi-compat-libdnssd-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev \
            pkg-config \
            qtbase5-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl qt@5

      - name: Configure
        run: |
          qt_prefix=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            qt_prefix="$(brew --prefix qt@5)"
          fi
          cmake -S . -B build \
            -DBARRIER_BUILD_GUI=ON \
            -DBARRIER_BUILD_TESTS=ON \
            -DBARRIER_BUILD_INSTALLER=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DCMAKE_PREFIX_PATH="$qt_prefix" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --target barriers unittests --parallel

      - name: Build GUI
        run: cmake --build build --target barrier guiunittests --parallel

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: cmake --build build --target Barrier_MacOS --parallel

      - name: Test
        run: ./build/bin/unittests

      - name: Test GUI helpers
        run: ./build/bin/guiunittests

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Barrier-macOS-${{ runner.arch }}
          path: build/bundle/Barrier-*.dmg
          if-no-files-found: error
