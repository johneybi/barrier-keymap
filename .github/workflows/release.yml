name: Release

on:
  push:
    tags:
      - "keymap-v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-cli:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: barrier-keymap-linux-x64
          - os: macos-latest
            artifact: barrier-keymap-macos

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavahi-compat-libdnssd-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl

      - name: Configure
        run: |
          cmake -S . -B build \
            -DBARRIER_BUILD_GUI=OFF \
            -DBARRIER_BUILD_TESTS=OFF \
            -DBARRIER_BUILD_INSTALLER=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build command line binaries
        run: cmake --build build --target barriers barrierc --parallel

      - name: Assemble archive
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp build/bin/barriers "dist/${{ matrix.artifact }}/"
          cp build/bin/barrierc "dist/${{ matrix.artifact }}/"
          cp README.md LICENSE "dist/${{ matrix.artifact }}/"
          cp doc/barrier.conf.example-remaps doc/key-remaps.md \
            "dist/${{ matrix.artifact }}/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" \
            "${{ matrix.artifact }}"
          shasum -a 256 "dist/${{ matrix.artifact }}.tar.gz" \
            > "dist/${{ matrix.artifact }}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  package-windows-installer:
    name: Package Windows installer
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Check out release tools
        if: inputs.source_ref != ''
        uses: actions/checkout@v4
        with:
          ref: master
          path: .release-tools
          sparse-checkout: |
            clean_build.bat
            build_installer.bat

      - name: Use current release tools
        if: inputs.source_ref != ''
        shell: pwsh
        run: |
          Copy-Item .release-tools\clean_build.bat .\clean_build.bat -Force
          Copy-Item .release-tools\build_installer.bat .\build_installer.bat -Force

      - name: Install Bonjour SDK-like
        shell: pwsh
        run: .\azure-pipelines\download_install_bonjour_sdk_like.ps1

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O deps\Qt

      - name: Configure build environment
        shell: pwsh
        run: |
          @'
          set B_BUILD_TYPE=Release
          set B_QT_ROOT=%cd%\deps\Qt
          set B_QT_VER=5.15.2
          set B_QT_MSVC=msvc2019_64
          set B_BONJOUR=%cd%\deps\BonjourSDKLike
          '@ | Set-Content -Encoding ASCII build_env.bat

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          clean_build.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version 5.6.1.20190126 --allow-downgrade --yes

      - name: Build installer
        shell: cmd
        run: build_installer.bat

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: barrier-keymap-windows-installer
          path: build\installer-inno\bin\*.exe

      - name: Upload GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer-inno/bin/*.exe
