name: KeyStitch bug report
description: Report a reproducible KeyStitch remapping or cross-platform input problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include the smallest configuration and the exact platform path that reproduces the problem.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and platforms
      description: KeyStitch/Barrier commit or release, server OS, client OS, and keyboard layout.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Minimal configuration
      description: "Paste a redacted section: remaps block and screen names."
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
      description: Steps, observed key events/logs, and whether upstream Barrier reproduces it.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have removed secrets and private host information.
          required: true
